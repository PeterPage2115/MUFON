# travian-discord-report-bot — CI.
#
# Two jobs:
#   (a) build-push — builds the image and pushes it to GHCR
#       (ghcr.io/peterpage2115/mufon) on every push to `main`; tags:
#       `latest` + the 40-char commit sha. The repository is PRIVATE, so
#       the published image is private too — the server needs `docker
#       login ghcr.io` (PAT with read:packages) before `docker compose
#       pull` (see README "Updating").
#   (b) secret-scan — runs on EVERY push and pull request, unconditionally.
#       Gitleaks is the primary scanner; a plain grep for a
#       DISCORD_TOKEN-shaped value (20+ chars, so the EMPTY placeholder in
#       .env.example never trips it) is the fallback. If either finds
#       anything, the job fails.
name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-push:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/peterpage2115/mufon:latest
            ghcr.io/peterpage2115/mufon:${{ github.sha }}

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan all commits, not just HEAD.
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        # Free for personal repositories — no GITLEAKS_LICENSE needed.

      - name: Fallback DISCORD_TOKEN grep
        shell: bash
        run: |
          # Cheap fallback if gitleaks is ever unavailable. Requires 20+
          # chars after the key so the empty `.env.example` placeholder
          # (DISCORD_TOKEN=) never matches.
          if grep -rE "DISCORD_TOKEN[=:][A-Za-z0-9_.-]{20,}" \
              --include="*.py" --include="*.yml" --include="*.yaml" --include="*.sh" .; then
            echo "::error::DISCORD_TOKEN-like secret found in repository"
            exit 1
          fi
          echo "No DISCORD_TOKEN-like secrets found."
