[project]
name = "travian-discord-report-bot"
version = "0.1.0"
description = "Travian Discord report bot - daily map.sql snapshots, reports and dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.3",
    "APScheduler>=3.10",
    "httpx",
    "pydantic>=2",
    "fastapi",
    "uvicorn",
    "asyncpg>=0.29",
    "tzdata",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "basedpyright",
    "playwright",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travian"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.basedpyright]
include = ["src"]
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: browser smoke tests (require `uv run playwright install chromium`)",
]

