# travian-discord-report-bot — container deployment.
# Setup: `cp .env.example .env`, fill in DISCORD_TOKEN/CHANNEL_ID, then
# `docker compose up -d`. The image is published to GHCR by CI (T15);
# `build: .` lets you build locally for development.
#
# IMAGE_TAG selects the deployed image (default: latest). Deploy/rollback a
# specific commit with `IMAGE_TAG=<full-sha> ./update.sh` — verify what runs
# via GET /api/meta (build_sha must equal the tag).
services:
  bot:
    image: ghcr.io/peterpage2115/mufon:${IMAGE_TAG:-latest}
    build:
      context: .
      args:
        # Local builds identify themselves as "dev" unless overridden;
        # CI passes the real commit SHA.
        BUILD_SHA: ${BUILD_SHA:-dev}
    restart: unless-stopped
    env_file: .env
    environment:
      # Bind INSIDE the container: must be 0.0.0.0 for the port publish to
      # work. Access control is either the DASHBOARD_TOKEN (token mode) or
      # a complete Discord OAuth configuration (oauth mode, see .env): the
      # API routes require a valid session/Bearer token whenever the
      # dashboard is reachable beyond loopback. DASHBOARD_AUTH_MODE=none is
      # UNSAFE with this all-interface port mapping — never use it here.
      DASHBOARD_BIND: "0.0.0.0"
      # With DASHBOARD_BIND=0.0.0.0 and DASHBOARD_LOOPBACK_ONLY != "true"
      # the API requires auth (see app.py _auth_required). The static UI
      # and /healthz stay public so the browser can load the page and the
      # container HEALTHCHECK works without the secret.
      DASHBOARD_LOOPBACK_ONLY: "false"
      # Container system time (tools like `date`). Python timezones come from
      # the pip tzdata package — FETCH_TZ/REPORT_TZ are independent of this.
      TZ: Europe/Warsaw
    ports:
      # Published on all host interfaces — keep either token mode with a
      # real DASHBOARD_TOKEN or complete OAuth mode (all OAUTH_* keys set)
      # in .env. Do NOT run this mapping with DASHBOARD_AUTH_MODE=none or an
      # empty token.
      - "8099:8090"
    volumes:
      # SQLite data survives container recreation.
      - travian-data:/data

volumes:
  travian-data:
