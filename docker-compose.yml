# travian-discord-report-bot — container deployment.
# Setup: `cp .env.example .env`, fill in DISCORD_TOKEN/CHANNEL_ID, then
# `docker compose up -d`. The image is published to GHCR by CI (T15);
# `build: .` lets you build locally for development.
services:
  bot:
    image: ghcr.io/peterpage2115/mufon:latest
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Bind INSIDE the container: must be 0.0.0.0 for the port publish to
      # work. Access control is the DASHBOARD_TOKEN (set it in .env): the
      # API routes require Authorization: Bearer <DASHBOARD_TOKEN> whenever
      # the dashboard is reachable beyond loopback.
      DASHBOARD_BIND: "0.0.0.0"
      # With DASHBOARD_BIND=0.0.0.0 and DASHBOARD_LOOPBACK_ONLY != "true"
      # the API requires the token (see app.py _auth_required). The static
      # UI and /healthz stay public so the browser can load the page and
      # the container HEALTHCHECK works without the secret.
      DASHBOARD_LOOPBACK_ONLY: "false"
      # Container system time (tools like `date`). Python timezones come from
      # the pip tzdata package — FETCH_TZ/REPORT_TZ are independent of this.
      TZ: Europe/Warsaw
    ports:
      # Published on all interfaces — the DASHBOARD_TOKEN env (see .env) is
      # the access control. Do NOT remove the token when this port is open.
      - "8099:8090"
    volumes:
      # SQLite data survives container recreation.
      - travian-data:/data

volumes:
  travian-data:
